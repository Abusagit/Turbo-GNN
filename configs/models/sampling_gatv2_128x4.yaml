# Mini-batch neighbor-sampling rebuttal model (scripts/train_sampled.py).
# One layer template; the runner repeats it len(--fanouts) times.
# GATv2 here: out_channels is the per-head width (our kernel needs 32/64/128/256),
# 4 heads x 128, concatenated and projected back to 128 -- the ICML rebuttal setup.
architecture: node_classifier
dropout: 0.0

encoder:
  layers:
    - layer_type: residual_block
      conv_type: null  # set by the runner (gat_v2)
      backend: null    # set by the runner (cuda | dgl)
      in_channels: auto
      out_channels: 128
      heads: 4
      norm: layer
      activation: silu
      dropout: 0.0
      residual: true
      conv_kwargs: {}
